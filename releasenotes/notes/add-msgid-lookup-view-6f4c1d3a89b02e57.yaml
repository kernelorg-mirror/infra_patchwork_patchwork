---
features:
  - |
    A new view at ``/m/<msgid>/`` looks a message ID up across every project,
    showing the state, delegate and series position of each copy along with a
    link to the mailing list archive. Message IDs are only unique within a
    project, so a message delivered to several tracked lists is listed once
    per project.
  - |
    A new ``DEFAULT_ARCHIVE_URL_FORMAT`` setting provides a mailing list
    archive URL format string for message IDs that no project tracks, so that
    the message ID lookup view can still point elsewhere. It defaults to
    ``None``, which omits the link.
